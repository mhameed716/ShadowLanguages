name: shadow_languages
description: >-
  ShadowLanguages — a cyberpunk PDF translation terminal for Android.
  Extracts the text layer of any PDF, translates it with Google Gemini while
  keeping every original coordinate, then injects the translation back over the
  artwork so images, colours, fonts and tables survive untouched.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

# NOTE: pdfrx 2.6.x requires Flutter >= 3.47 / Dart >= 3.13.
# Run `flutter upgrade` before `flutter pub get` if resolution complains.

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # state
  flutter_riverpod: ^2.6.1

  # pdf
  pdfrx: ^2.6.5

  # networking
  dio: ^5.4.0

  # files & storage
  file_picker: ^8.0.0
  path: ^1.9.0
  path_provider: ^2.1.0
  share_plus: ^9.0.0
  shared_preferences: ^2.2.0
  flutter_secure_storage: ^9.0.0

  # misc
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/pdf/
    - assets/fonts/ui/
    - assets/branding/

  fonts:
    - family: Orbitron
      fonts:
        - asset: assets/fonts/ui/Orbitron-Regular.ttf
          weight: 400
        - asset: assets/fonts/ui/Orbitron-Bold.ttf
          weight: 700
    - family: ShareTechMono
      fonts:
        - asset: assets/fonts/ui/ShareTechMono-Regular.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/ui/JetBrainsMono-Regular.ttf
    - family: NotoSans
      fonts:
        - asset: assets/fonts/pdf/NotoSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/pdf/NotoSans-Bold.ttf
          weight: 700
    - family: NotoNaskhArabic
      fonts:
        - asset: assets/fonts/pdf/NotoNaskhArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/pdf/NotoNaskhArabic-Bold.ttf
          weight: 700
